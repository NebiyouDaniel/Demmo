<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#8CC63F" />
    <meta name="description" content="telebirr SuperApp — Ethiopian digital wallet" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="telebirr" />
    <meta name="application-name" content="telebirr" />
    <meta name="msapplication-TileColor" content="#8CC63F" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>telebirr SuperApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Apply saved font size before first paint (login, splash, everything) */
      (function () {
        try {
          var raw = localStorage.getItem("telebirr.fontSize");
          var n;
          if (raw === "sm") n = 13;
          else if (raw === "md") n = 16;
          else if (raw === "lg") n = 19;
          else n = raw == null ? 16 : Number(raw);
          if (!Number.isFinite(n)) n = 16;
          n = Math.min(32, Math.max(10, Math.round(n)));
          document.documentElement.style.setProperty("--ui-scale", String(n / 16));
        } catch (e) {}
      })();

      /* Prevent pull-to-refresh and overscroll */
      html, body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        position: fixed;
        width: 100%;
        height: 100%;
      }
      #root {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      /* Splash screen */
      #splash {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.3s;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .mark {
        width: 104px;
        height: 104px;
        border-radius: 18px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      #splash .mark img { width: 76px; height: 76px; object-fit: contain; }
      #splash .dots { position: relative; width: 52px; height: 52px; }
      #splash .dots i {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 9px;
        height: 9px;
        margin: -4.5px 0 0 -4.5px;
        border-radius: 50%;
        background: #8CC63F;
        animation: splash-pulse 1.1s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: .28; }
        50% { opacity: 1; }
      }
      #splash .dots i:nth-child(2) { animation-delay: .09s; }
      #splash .dots i:nth-child(3) { animation-delay: .18s; }
      #splash .dots i:nth-child(4) { animation-delay: .27s; }
      #splash .dots i:nth-child(5) { animation-delay: .36s; }
      #splash .dots i:nth-child(6) { animation-delay: .45s; }
      #splash .dots i:nth-child(7) { animation-delay: .54s; }
      #splash .dots i:nth-child(8) { animation-delay: .63s; }
    </style>
  </head>
  <body>
    <!-- Splash screen -->
    <div id="splash">
      <div class="mark">
        <img src="/telebirr-symbol.png" alt="telebirr" />
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }

      // Hide splash after app loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) { splash.classList.add('hide'); setTimeout(() => splash.remove(), 400); }
        }, 1500);
      });
    </script>
  </body>
</html>
